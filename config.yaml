# Ghost Shift configuration (tuned for Raspberry Pi 5)

system:
  workspace_dir: "~/workspace"
  data_dir: "~/.local/share/ghost-shift"
  terminal:
    font: "Lat2-Terminus16"
    color_scheme: "amber"

typist:
  base_wpm: 100
  variance: 20
  typo_chance: 0.03
  correction_delay_min: 0.05
  correction_delay_max: 0.2
  pause_punctuation: 0.12
  pause_newline: 0.4
  # optional (defaults shown):
  # code_speed: 3.0
  # mistake_chance: 0.15
  # max_mistakes_per_block: 5

llm:
  local_model: "qwen2.5-coder:3b"
  deadline_s: 2400

# Planned cloud offload (keys come from environment variables, never this file):
# providers:
#   - name: groq
#     base_url: "https://api.groq.com/openai/v1"
#     model: "llama-3.3-70b-versatile"
#     api_key_env: "GROQ_API_KEY"

sandbox:
  max_execution_time: 30
  allowed_modules: [time, datetime, random, math, curses, psutil, textwrap, itertools, collections]

codegen:
  allowed_modules: [time, random, math]

desk:
  syslog_cmd: "journalctl -f -n 40 --no-pager"
  animate: true

director:
  think_seconds: 15      # how long the THINKING window runs before each code scene
  run_seconds: 120       # hard cap on a live program run

mail:
  enabled: true
  every_min: 2           # at least this many code scenes between mail scenes
  every_max: 4
  target_unread: 3       # unread messages the worker keeps ready
  max_read: 30           # read messages kept in the inbox
